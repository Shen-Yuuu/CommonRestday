    <div class="edition">周班表 · 交互设计稿 01</div>
    <nav class="rail-nav" aria-label="原型页面">
      <button data-action="view" data-view="week" class="active"><span>01</span>按周排班</button>
      <button data-action="view" data-view="presets"><span>02</span>常用班次</button>
      <button data-action="view" data-view="home"><span>03</span>首页 ＋日程</button>
    </nav>
    <div class="rail-foot">独立 HTML 原型 · 2026.10.09<br>不连接云端，不修改 App 数据。<br>刷新页面会恢复样例。</div>
  </aside>

<script id="roster-model">
/* 独立原型的日期模型；不访问 App 或云端。 */
const RosterModel = (() => {
  const clone = value => JSON.parse(JSON.stringify(value));
  function stamp(date) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date || '')) throw new Error('请选择有效日期');
    const value = Date.parse(date + 'T00:00:00Z');
    if (!Number.isFinite(value) || new Date(value).toISOString().slice(0,10) !== date) throw new Error('请选择有效日期');
    return value / 60000;
  }
  function addDays(date, count) { return new Date((stamp(date) + count * 1440) * 60000).toISOString().slice(0,10); }
  function monday(date) { return addDays(date, -((new Date(stamp(date)*60000).getUTCDay()+6)%7)); }
  function minutes(time) {
    if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(time || '')) throw new Error('请填写有效时间');
    return Number(time.slice(0,2))*60 + Number(time.slice(3));
  }
  function intervals(date, entries) {
    const base = stamp(date);
    return entries.flatMap(entry => {
      if (!entry.segments.length) throw new Error('至少添加一个时段');
      return entry.segments.map(segment => {
        const start = minutes(segment.start), end = minutes(segment.end) + (segment.nextDay ? 1440 : 0);
        if (end <= start || end-start > 1440) throw new Error('结束时间须晚于开始时间；跨夜请勾选“次日结束”，单段不能超过24小时');
        return {start:base+start,end:base+end,name:entry.name,date};
      });
    });
  }
  function conflicts(roster) {
    const values = Object.entries(roster).flatMap(([date,day]) => intervals(date,day.entries || [])).sort((a,b)=>a.start-b.start);
    const found=[];
    for(let i=0;i<values.length;i++) for(let j=i+1;j<values.length && values[j].start<values[i].end;j++) {
      found.push({first:values[i],second:values[j]});
    }
    return found;
  }
  function snapshot(preset, id) { return {...clone(preset),id}; }
  function weekSummary(roster, start) {
    const result={work:0,rest:0,unknown:0};
    for(let i=0;i<7;i++) result[roster[addDays(start,i)]?.status || 'unknown']++;
    return result;
  }
  function copyWeeks(roster, source, destinations, strategy) {
    if (!['keep','replace','merge'].includes(strategy)) throw new Error('请选择已有安排的处理方式');
    const next=clone(roster); let written=0, skipped=0;
    const targets=[...new Set(destinations)];
    if (!targets.length) throw new Error('请选择目标周');
    for(const target of targets) {
      if(monday(target)!==target || target===source) throw new Error('目标须为其他周的周一');
      for(let i=0;i<7;i++) {
        const from=roster[addDays(source,i)], to=addDays(target,i);
        if(!from || from.status==='unknown') continue;
        const existing=next[to];
        if(strategy==='keep' && existing && existing.status!=='unknown'){skipped++;continue;}
        if(strategy==='merge' && existing?.status==='work' && from.status==='rest'){skipped++;continue;}
        const incoming=clone(from);
        incoming.entries=incoming.entries.map((entry,k)=>({...entry,id:'copy-'+to+'-'+k}));
        if(strategy==='merge' && existing?.status==='work' && incoming.status==='work') incoming.entries=[...existing.entries,...incoming.entries];
        next[to]=incoming;written++;
      }
    }
    const overlap=conflicts(next);
    if(overlap.length) {
      const problem=overlap[0];
      throw new Error(problem.first.date+'「'+problem.first.name+'」与 '+problem.second.date+'「'+problem.second.name+'」时间重叠，请调整后再复制');
    }
    return {roster:next,written,skipped};
  }
  function weeklyTargets(source, from, through) {
    if(monday(from)!==from || monday(through)!==through) throw new Error('起止日期请选择周一');
    const span=stamp(through)-stamp(from);
    if(span<0 || span>365*1440) throw new Error('结束周须不早于开始周，原型最多演示一年');
    const result=[];
    for(let date=from;stamp(date)<=stamp(through);date=addDays(date,7)) if(date!==source) result.push(date);
    return result;
  }
  return {clone,stamp,addDays,monday,minutes,intervals,conflicts,snapshot,weekSummary,copyWeeks,weeklyTargets};
})();

function readSegments(){return [...modalRoot.querySelectorAll('.segment-editor')].map(el=>({start:el.querySelector('.seg-start').value,end:el.querySelector('.seg-end').value,nextDay:el.querySelector('.seg-next').checked}));}
function presetEditor(id,forDate){
  const preset=presets.find(p=>p.id===id)||{name:'',color:'#83a8d5',segments:[{start:'09:00',end:'12:00',nextDay:false}]};
  sheet(forDate?'自填工作时间':id?'编辑常用班次':'新建常用班次',forDate?fullDate(forDate)+' · 仅安排这一天':'支持一天中的多段时间。','<div class="inline-field"><label for="entry-name">名称</label><input id="entry-name" placeholder="如：白班、门诊班" maxlength="18" value="'+esc(preset.name)+'"></div><div class="section-label">工作时段</div><div id="segment-list">'+preset.segments.map(segmentEditor).join('')+'</div><button class="link" data-action="add-segment" style="padding:7px 0 17px">＋ 再加一个时段</button><div class="row between"><label for="entry-color" class="field-title">班次颜色</label><input type="color" id="entry-color" aria-label="班次颜色" value="'+color(preset.color)+'"></div>','<button class="secondary" data-action="'+(forDate?'edit-day':'close')+'" '+(forDate?'data-date="'+forDate+'"':'')+'>取消</button><button class="primary" data-action="save-preset" data-id="'+(id||'')+'" data-date="'+(forDate||'')+'">'+(forDate?'加入本日':'保存班次')+'</button>');
}
function savePreset(id,date){
  const name=document.getElementById('entry-name').value.trim();if(!name){error('给这个班次取一个名字吧');return;}
  const entry={id:id||'p-'+Date.now(),name,color:document.getElementById('entry-color').value,segments:readSegments()};
  try{M.intervals(TODAY,[entry]);if(M.conflicts({[TODAY]:{entries:[entry]}}).length)throw new Error('这个班次的两个时段重叠，请调整时间');}catch(e){error(e.message);return;}
  if(date){const day=getDay(date);if(commitDay(date,{status:'work',entries:[...day.entries,M.snapshot(entry,'work-'+Date.now())]}))toast('已加入当天班表草稿');return;}
  const index=presets.findIndex(p=>p.id===id);if(index>=0)presets[index]=entry;else presets.push(entry);closeSheet(false);render();toast('已保存常用班次 · 已排班表不变');
}
function showCopy(mode='once'){
  copyMode=mode;
  let body='<div class="sheet-card purple"><div class="row between"><b>以这一周为样本</b><span class="small num">'+range(week)+'</span></div><p>只复制已填的工作与休息，不复制个人安排。</p></div><div class="choice-tabs"><button class="'+(mode==='once'?'active':'')+'" data-action="copy-mode" data-mode="once">复制到其他周</button><button class="'+(mode==='repeat'?'active':'')+'" data-action="copy-mode" data-mode="repeat">按周重复</button></div>';
  if(mode==='once'){body+='<div class="field"><label>选择目标周</label>';for(let i=1;i<=3;i++){const target=M.addDays(week,i*7);body+='<label class="check-row week-dest"><input class="copy-target" type="checkbox" value="'+target+'" '+(i===1?'checked':'')+'><span class="num">'+range(target)+(i===1?' · 下一周':'')+'</span></label>';}body+='</div>';}else body+='<div class="form-grid"><div class="field"><label for="repeat-from">开始周（周一）</label><input type="date" id="repeat-from" value="'+M.addDays(week,7)+'"></div><div class="field"><label for="repeat-to">结束周（周一）</label><input type="date" id="repeat-to" value="'+M.addDays(week,28)+'"></div></div><p class="small muted" style="margin-bottom:17px">截止到结束周的周日，不会无限延长。</p>';
  body+='<div class="field-title" style="margin-bottom:9px">目标日期已有工作安排时</div><div class="strategy-options"><label><input type="radio" name="strategy" value="keep" checked>保留原有</label><label><input type="radio" name="strategy" value="replace">替换原有</label><label><input type="radio" name="strategy" value="merge">合并班次</label></div><p class="small muted">合并前检查实际时间是否重叠，跨夜也会检查。</p>';
  sheet('复制 / 重复班表','你来决定，排到哪一周。',body,'<button class="secondary" data-action="close">取消</button><button class="primary" data-action="perform-copy">'+(mode==='once'?'确认复制':'确认重复')+'</button>');
}
function performCopy(){
  const strategy=modalRoot.querySelector('input[name=strategy]:checked').value;
  try{
    const targets=copyMode==='once'?[...modalRoot.querySelectorAll('.copy-target:checked')].map(i=>i.value):M.weeklyTargets(week,document.getElementById('repeat-from').value,document.getElementById('repeat-to').value);
    const result=M.copyWeeks(roster,week,targets,strategy);roster=result.roster;
    for(const target of targets)for(let i=0;i<7;i++){const date=M.addDays(target,i);if(roster[date])saved[date]=M.clone(roster[date]);}
    closeSheet(false);week=targets[0];selected=week;view='week';render();toast('已复制并保存 '+result.written+' 天'+(result.skipped?' · 保留 '+result.skipped+' 天原安排':''));
  }catch(e){error(e.message);}
}
function addSchedule(){sheet('安排日程','这是你的安排，不是共同计划。','<button class="choice" data-action="personal"><span class="choice-icon">'+icon('calendar')+'</span><span class="grow"><h3>个人安排</h3><p>运动、就医、办事等，只占用自己的时间。</p></span>'+icon('arrow')+'</button><button class="choice" data-action="work-date"><span class="choice-icon blue">'+icon('briefcase')+'</span><span class="grow"><h3>工作排班</h3><p>选择哪一天，添加或调整当天的班次。</p></span>'+icon('arrow')+'</button>');}
function workDate(){sheet('选择排班日期','默认今天，也可以调整其他日期。','<div class="field"><label for="work-date">哪一天</label><input type="date" id="work-date" value="'+TODAY+'"></div>','<button class="secondary" data-action="add-schedule">返回</button><button class="primary" data-action="go-work-date">安排这一天</button>');}
function personal(){
  personalWarned=false;
  sheet('个人安排','只安排自己的时间，无需 TA 确认。','<div class="chips" id="personal-kinds">'+['运动','就医','办事','其他'].map((name,i)=>'<button class="pill '+(!i?'active':'')+'" data-action="personal-kind" data-kind="'+name+'">'+name+'</button>').join('')+'</div><div class="inline-field"><label for="personal-title">标题</label><input id="personal-title" maxlength="30" placeholder="如：去练瑜伽"></div><div class="field"><label for="personal-date">日期</label><input type="date" id="personal-date" value="'+TODAY+'"></div><div id="segment-list">'+segmentEditor({start:'19:00',end:'20:00',nextDay:false})+'</div><div class="sheet-card purple"><p>保存后计入自己的忙碌时间。云配对时，仅按共享等级分享，不会向 TA 发起计划邀请。</p></div>','<button class="secondary" data-action="add-schedule">返回</button><button class="primary" data-action="save-personal">保存日程</button>');
}
function savePersonal(){
  const name=document.getElementById('personal-title').value.trim(),date=document.getElementById('personal-date').value;
  if(!name){error('请填写日程标题');return;}
  const entry={id:'event-'+Date.now(),name,kind:modalRoot.querySelector('#personal-kinds .active').dataset.kind,color:'#9b82c0',segments:readSegments()};
  try{
    const all=Object.entries(roster).flatMap(([d,day])=>M.intervals(d,day.entries));
    for(const [d,items] of Object.entries(events))all.push(...M.intervals(d,items));
    const own=M.intervals(date,[entry]);
    if(!personalWarned&&own.some(a=>all.some(b=>a.start<b.end&&a.end>b.start))){personalWarned=true;error('这段时间已有安排。仍要安排在此时段的话，请再点一次保存；不会替换已有内容。',true);return;}
    events[date]=[...(events[date]||[]),entry];closeSheet(false);view='home';render();toast(date===TODAY?'已加入今天的个人安排':'已添加 '+dateText(date)+' 的个人安排，可在周班表中查看');
  }catch(e){error(e.message);}
}
function conflictDemo(){
  sheet('跨日也不能重叠','演示检查，不修改你的班表草稿。','<div class="sheet-card purple"><h3>周四 · 夜班</h3><p class="num">22:00 — 次日 10:00</p></div><div class="sheet-card"><h3>周五 · 早班</h3><p class="num">08:00 — 15:00</p></div><div class="error">周五 08:00 — 10:00 同时有夜班与早班，无法保存。即使分属两天，也会一起检查。</div>','<button class="primary" data-action="close">明白了</button>');
}
document.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');if(!button||button.disabled)return;const d=button.dataset;
  switch(d.action){
    case 'view':go(d.view);break;
    case 'previous':case 'next':week=M.addDays(week,d.action==='next'?7:-7);selected=week;render();break;
    case 'this-week':week=M.monday(TODAY);selected=TODAY;render();break;
    case 'select-day':selected=d.date;render();break;
    case 'edit-day':showDay(d.date);break;
    case 'apply-preset':{const day=getDay(d.date),preset=presets.find(p=>p.id===d.id);if(commitDay(d.date,{status:'work',entries:[...day.entries,M.snapshot(preset,'entry-'+Date.now())]}))toast('已加入班表草稿');break;}
    case 'remove-entry':{const entries=getDay(d.date).entries.filter(e=>e.id!==d.id);commitDay(d.date,{status:entries.length?'work':'unknown',entries});break;}
    case 'mark-rest':askMark(d.date,'rest');break;
    case 'mark-unknown':askMark(d.date,'unknown');break;
    case 'confirm-mark':commitDay(d.date,{status:d.status,entries:[]});break;
    case 'save-week':for(let i=0;i<7;i++){const date=M.addDays(week,i);if(roster[date])saved[date]=M.clone(roster[date]);else delete saved[date];}render();toast('这一周已保存到原型内存 · 不会自动重复');break;
    case 'edit-preset':presetEditor(d.id);break;
    case 'new-preset':presetEditor();break;
    case 'custom-work':presetEditor(null,d.date);break;
    case 'add-segment':document.getElementById('segment-list').insertAdjacentHTML('beforeend',segmentEditor({start:'14:00',end:'18:00',nextDay:false}));break;
    case 'remove-segment':if(modalRoot.querySelectorAll('.segment-editor').length>1)button.closest('.segment-editor').remove();else error('至少保留一个时段');break;
    case 'save-preset':savePreset(d.id,d.date);break;
    case 'copy':showCopy();break;
    case 'copy-mode':showCopy(d.mode);break;
    case 'perform-copy':performCopy();break;
    case 'add-schedule':addSchedule();break;
    case 'work-date':workDate();break;
    case 'go-work-date':try{const date=document.getElementById('work-date').value;M.stamp(date);view='week';showDay(date);}catch(e){error(e.message);}break;
    case 'personal':personal();break;
    case 'personal-kind':document.querySelectorAll('#personal-kinds .pill').forEach(b=>b.classList.toggle('active',b===button));personalWarned=false;break;
    case 'save-personal':savePersonal();break;
    case 'plan-note':sheet('共同计划保持独立','本次原型只重新设计个人排班。','<div class="sheet-card purple"><p>共同计划仍沿用“发起邀请 → TA 确认 → 双方占用时间”的流程，不与个人日程混在一起。本设计稿不连接计划云服务。</p></div>','<button class="primary" data-action="close">返回</button>');break;
    case 'conflict-demo':conflictDemo();break;
    case 'close':closeSheet();break;
    case 'backdrop':if(event.target===button)closeSheet();break;
    case 'reset':reset();toast('已恢复初始样例');break;
  }
});
document.addEventListener('input',event=>{if(modalRoot.contains(event.target)){personalWarned=false;const el=document.getElementById('form-error');if(el)el.textContent='';}});
document.addEventListener('keydown',event=>{
  if(!modalRoot.childElementCount)return;
  if(event.key==='Escape'){event.preventDefault();closeSheet();}
  if(event.key==='Tab'){
    const elements=[...modalRoot.querySelectorAll('button,input,select')].filter(e=>!e.disabled),first=elements[0],last=elements.at(-1);
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}
  }
});
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));reset();
})();
</script>
</body>
</html>
